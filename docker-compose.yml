# 실행 (저장소 루트에서):  docker compose up --build
# 화면:  http://localhost  (포트가 사용 중이면 WEB_PORT=8080 으로 바꿔 실행)
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile.server
    image: energy-api:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"     # 로컬 디버깅용. 외부에는 열지 않음
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build: ./web
    image: energy-web:local
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
